<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poetry &amp; Song Translation Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

    <!-- RiTa.js NLP Library (UMD from CDNJS for browser support) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/rita/2.8.31/rita.min.js" crossorigin="anonymous"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .has-comment {
            border-bottom: 2px dotted #3b82f6;
        }
        /* Mobile touch optimization */
        .touch-pan-y {
            touch-action: pan-y;
        }
        .touch-pan-x {
            touch-action: pan-x;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-[100dvh] w-full m-0 p-0 flex flex-col font-sans overflow-hidden">
    
    <div id="root" class="flex-1 flex flex-col overflow-hidden w-full h-full max-w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } = React;

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // 20 Highly Distinct Colors (Tailwind 300/400 range equivalents)
        const DISTINCT_COLORS = [
            '#fca5a5', '#6ee7b7', '#93c5fd', '#fcd34d', '#c4b5fd', 
            '#f9a8d4', '#5eead4', '#fdba74', '#a5b4fc', '#bef264',
            '#f0abfc', '#7dd3fc', '#f87171', '#60a5fa', '#34d399',
            '#fbbf24', '#a78bfa', '#f472b6', '#2dd4bf', '#fb923c'
        ];

        const getRhymeColor = (groupId) => {
            if (!groupId) return 'transparent';
            if (groupId <= DISTINCT_COLORS.length) {
                return DISTINCT_COLORS[groupId - 1];
            }
            const hue = (groupId * 137.508) % 360; 
            return `hsl(${hue}, 85%, 85%)`;
        };

        const STATUS_COLORS = {
            NEUTRAL: 'bg-gray-100 border-gray-300',
            INCOMPLETE: 'bg-orange-100 border-orange-400',
            ALMOST: 'bg-lime-200 border-lime-500',
            COMPLETE: 'bg-green-400 border-green-600 text-green-900'
        };

        // Core Fallback Syllable Engine with RiTa
        const ARPABET_VOWELS = ['aa', 'ae', 'ah', 'ao', 'aw', 'ay', 'eh', 'er', 'ey', 'ih', 'iy', 'ow', 'oy', 'uh', 'uw'];
        const isVowelPhone = (p) => {
            return ARPABET_VOWELS.includes(p.toLowerCase().replace(/[^a-z]/g, ''));
        };

        const getSyllables = (word) => {
            let clean = word.toLowerCase().replace(/[^a-z]/g, '');
            if (!clean || !window.RiTa) {
                return [{ text: word, stress: false, rhymeKey: null }];
            }

            try {
                let phonemes = window.RiTa.phones(clean);
                let stressPattern = window.RiTa.stresses(clean);
                let stresses = stressPattern ? stressPattern.split(/[\/\-]/) : [];
                let phoneChunks = phonemes ? phonemes.split('-') : [];
                
                let sylRhymes = [];
                let currentVowel = null;
                let currentTrailing = [];

                phoneChunks.forEach(p => {
                    if (isVowelPhone(p)) {
                        if (currentVowel) {
                            sylRhymes.push(`${currentVowel}-${currentTrailing.join('-')}`);
                        }
                        currentVowel = p;
                        currentTrailing = [];
                    } else if (currentVowel) {
                        currentTrailing.push(p);
                    }
                });
                if (currentVowel) {
                    sylRhymes.push(`${currentVowel}-${currentTrailing.join('-')}`);
                }

                let totalSyllables = Math.max(1, sylRhymes.length);
                let ritaChunks = window.RiTa.syllables(clean).split(/[\/\-]/);
                let orthographicSyls = [];

                if (ritaChunks.length === totalSyllables) {
                    orthographicSyls = ritaChunks;
                } else {
                    let regexChunks = clean.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi) || [];
                    if (regexChunks.length === totalSyllables) {
                        orthographicSyls = regexChunks;
                    } else {
                        let step = Math.ceil(clean.length / totalSyllables);
                        for(let i=0; i<totalSyllables; i++) {
                            orthographicSyls.push(clean.substring(i*step, (i+1)*step));
                        }
                        if (orthographicSyls.length > 0) orthographicSyls[orthographicSyls.length-1] = clean.substring((totalSyllables-1)*step);
                    }
                }
                
                let syllablesData = [];
                let origIndex = 0;
                
                for (let i = 0; i < orthographicSyls.length; i++) {
                    let textChunk = "";
                    let chunkClean = orthographicSyls[i] || "";
                    let cleanMatched = 0;
                    
                    while (cleanMatched < chunkClean.length && origIndex < word.length) {
                        let char = word[origIndex];
                        textChunk += char;
                        if (/[a-zA-Z]/.test(char)) cleanMatched++;
                        origIndex++;
                    }
                    
                    if (i === orthographicSyls.length - 1 && origIndex < word.length) {
                        textChunk += word.substring(origIndex);
                    }
                    
                    syllablesData.push({
                        text: textChunk,
                        stress: (stresses[i] === '1' || stresses[i] === '2'),
                        rhymeKey: sylRhymes[i] || null
                    });
                }
                return syllablesData;
            } catch (e) {
                console.error("Linguistic processing error:", e);
                return [{ text: word, stress: false, rhymeKey: null }];
            }
        };

        const getCaretPosition = (element) => {
            let caretOffset = 0;
            const doc = element.ownerDocument || element.document;
            const win = doc.defaultView || doc.parentWindow;
            const sel = win.getSelection();
            if (sel.rangeCount > 0) {
                const range = win.getSelection().getRangeAt(0);
                const preCaretRange = range.cloneRange();
                preCaretRange.selectNodeContents(element);
                preCaretRange.setEnd(range.endContainer, range.endOffset);
                caretOffset = preCaretRange.toString().length;
            }
            return caretOffset;
        };

        const setCaretPosition = (element, offset) => {
            const sel = window.getSelection();
            const range = document.createRange();
            let charIndex = 0;
            let nodeStack = [element];
            let node;
            let found = false;

            while (!found && (node = nodeStack.pop())) {
                if (node.nodeType === 3) {
                    const nextCharIndex = charIndex + node.length;
                    if (offset >= charIndex && offset <= nextCharIndex) {
                        range.setStart(node, offset - charIndex);
                        range.collapse(true);
                        found = true;
                    }
                    charIndex = nextCharIndex;
                } else {
                    let i = node.childNodes.length;
                    while (i--) {
                        nodeStack.push(node.childNodes[i]);
                    }
                }
            }
            if (found) {
                sel.removeAllRanges();
                sel.addRange(range);
            }
        };

        const App = () => {
            const [appMode, setAppMode] = useState('setup'); 
            const [rawText, setRawText] = useState("");
            const [segments, setSegments] = useState([]);
            const [title, setTitle] = useState("Untitled Work");
            
            const [focusedRhymeGroup, setFocusedRhymeGroup] = useState(null);
            const [activeTokenPopup, setActiveTokenPopup] = useState(null);
            const [showResetModal, setShowResetModal] = useState(false);
            const [errorMsg, setErrorMsg] = useState(null);
            const [showExportMenu, setShowExportMenu] = useState(false);
            const fileInputRef = useRef(null);

            const compactRhymes = useCallback((segs) => {
                let map = {};
                let nextId = 1;

                segs.forEach(seg => {
                    if (seg.isBlank) return;
                    seg.tokens.forEach(tok => {
                        tok.syllables?.forEach(syl => {
                            if (syl.rhymeGroup && !map[syl.rhymeGroup]) {
                                map[syl.rhymeGroup] = nextId++;
                            }
                        });
                    });
                    seg.translations.forEach(tr => {
                        tr.tokens?.forEach(tok => {
                            tok.syllables?.forEach(syl => {
                                if (syl.rhymeGroup && !map[syl.rhymeGroup]) {
                                    map[syl.rhymeGroup] = nextId++;
                                }
                            });
                        });
                    });
                });

                return segs.map(seg => {
                    if (seg.isBlank) return seg;
                    return {
                        ...seg,
                        tokens: seg.tokens.map(tok => ({
                            ...tok, syllables: tok.syllables?.map(syl => ({
                                ...syl, rhymeGroup: syl.rhymeGroup ? map[syl.rhymeGroup] : null
                            }))
                        })),
                        translations: seg.translations.map(tr => ({
                            ...tr, tokens: tr.tokens?.map(tok => ({
                                ...tok, syllables: tok.syllables?.map(syl => ({
                                    ...syl, rhymeGroup: syl.rhymeGroup ? map[syl.rhymeGroup] : null
                                }))
                            }))
                        }))
                    };
                });
            }, []);

            const tokenizeText = (text, oldTokens = [], type = 'source') => {
                const words = text.split(/(\s+)/).filter(w => w.length > 0);
                let remainingOldTokens = [...oldTokens.filter(t => !t.isSpace && !t.isPunctuation)];

                return words.map((w) => {
                    const isSpace = /^\s+$/.test(w);
                    if (isSpace) return { id: generateId(), text: w, isSpace: true, isLineBreak: w.includes('\n'), syllables: [{text: w, stress: false}] };
                    
                    const isPunctuationOnly = /^[^a-zA-Z0-9\u0590-\u05FF]+$/.test(w);
                    if (isPunctuationOnly) return { id: generateId(), text: w, isPunctuation: true, syllables: [{text: w, stress: false}] };

                    const match = w.match(/^([^a-zA-Z0-9\u0590-\u05FF]*)(.*?)([^a-zA-Z0-9\u0590-\u05FF]*)$/);
                    const prefix = match[1] || "";
                    const core = match[2] || w;
                    const suffix = match[3] || "";

                    let bestMatch = null;
                    let bestMatchIdx = -1;
                    for (let i = 0; i < remainingOldTokens.length; i++) {
                        const ot = remainingOldTokens[i];
                        if (core === ot.core || (core.length > 1 && core.includes(ot.core)) || (ot.core.length > 1 && ot.core.includes(core))) {
                            bestMatch = ot;
                            bestMatchIdx = i;
                            break;
                        }
                    }

                    if (bestMatch) {
                        remainingOldTokens.splice(bestMatchIdx, 1);
                        let newSyllables = bestMatch.syllables.map(s => ({...s}));
                        
                        if (core !== bestMatch.core) {
                            const matchIdx = core.indexOf(bestMatch.core);
                            if (matchIdx !== -1) {
                                const addedPrefix = core.substring(0, matchIdx);
                                const addedSuffix = core.substring(matchIdx + bestMatch.core.length);
                                
                                if (addedPrefix) {
                                    if (newSyllables.length > 0) newSyllables[0].text = addedPrefix + newSyllables[0].text;
                                    else newSyllables.push({ text: addedPrefix, stress: false, rhymeGroup: null, rhymeKey: null });
                                }
                                if (addedSuffix) {
                                    if (newSyllables.length > 0) newSyllables[newSyllables.length - 1].text = newSyllables[newSyllables.length - 1].text + addedSuffix;
                                    else newSyllables.push({ text: addedSuffix, stress: false, rhymeGroup: null, rhymeKey: null });
                                }
                            } else {
                                // Deletions occurred, but core word matched somewhat.
                                // Absorb the new string but retain the base styles if possible.
                                if (newSyllables.length > 0) {
                                    newSyllables = [{ text: core, stress: newSyllables[0].stress, rhymeGroup: newSyllables[0].rhymeGroup, rhymeKey: newSyllables[0].rhymeKey }];
                                } else {
                                    newSyllables = type === 'source' ? getSyllables(core) : [{ text: core, stress: false, rhymeGroup: null, rhymeKey: null }]; 
                                }
                            }
                        }

                        return {
                            ...bestMatch,
                            text: w,
                            prefix: prefix,
                            core: core,
                            suffix: suffix,
                            syllables: newSyllables
                        };
                    }

                    return {
                        id: generateId(),
                        text: w,
                        prefix: prefix,
                        core: core,
                        suffix: suffix,
                        isPunctuation: false,
                        isSpace: false,
                        syllables: type === 'source' ? getSyllables(core) : [{ text: core, stress: false, rhymeGroup: null, rhymeKey: null }],
                        comment: ""
                    };
                });
            };

            const handleStart = () => {
                const lines = rawText.split('\n');
                const newSegments = lines.map(line => {
                    if (line.trim().length === 0) {
                        return { id: generateId(), isBlank: true, tokens: [], translations: [], notes: "" };
                    }
                    return {
                        id: generateId(),
                        isBlank: false,
                        tokens: tokenizeText(line, [], 'source'),
                        translations: [{ id: generateId(), text: "", tokens: [], status: 'NEUTRAL' }],
                        notes: ""
                    };
                });
                setSegments(newSegments);
                setAppMode('translate');
            };

            const analyzeAll = () => {
                setSegments(prevSegments => {
                    let flatSyls = [];
                    let wIdx = 0;
                    
                    prevSegments.forEach(seg => {
                        if (seg.isBlank) return;
                        seg.tokens.forEach(tok => {
                            if (!tok.isSpace && !tok.isPunctuation) {
                                tok.syllables.forEach((syl, sIdx) => {
                                    flatSyls.push({ 
                                        segId: seg.id, tokId: tok.id, sylIdx: sIdx, 
                                        wordIdx: wIdx, key: syl.rhymeKey, rhymeGroup: null 
                                    });
                                });
                                wIdx++; 
                            }
                        });
                    });

                    let nextGroupId = 1;
                    for (let i = 0; i < flatSyls.length; i++) {
                        let current = flatSyls[i];
                        if (!current.key || current.rhymeGroup !== null) continue;
                        
                        let matches = [current];
                        let lastMatchIdx = current.wordIdx;
                        
                        for (let j = i + 1; j < flatSyls.length; j++) {
                            let candidate = flatSyls[j];
                            if (candidate.wordIdx - lastMatchIdx > 70) break;
                            if (candidate.key === current.key && candidate.rhymeGroup === null) {
                                matches.push(candidate);
                                lastMatchIdx = candidate.wordIdx;
                            }
                        }
                        
                        if (matches.length > 1) {
                            matches.forEach(m => m.rhymeGroup = nextGroupId);
                            nextGroupId++;
                        }
                    }

                    let flatIdx = 0;
                    let analyzedSegs = prevSegments.map(segment => {
                        if (segment.isBlank) return segment;
                        return {
                            ...segment,
                            tokens: segment.tokens.map(token => {
                                if (token.isSpace || token.isPunctuation) return token;
                                return {
                                    ...token,
                                    syllables: token.syllables.map(s => {
                                        let fs = flatSyls[flatIdx++];
                                        return { ...s, rhymeGroup: fs.rhymeGroup };
                                    })
                                };
                            })
                        };
                    });
                    
                    return compactRhymes(analyzedSegs);
                });
            };

            const exportAllDrafts = () => {
                const lines = segments.map(seg => {
                    if (seg.isBlank) return "";
                    const draftTexts = seg.translations
                        .map(t => t.text)
                        .filter(txt => txt && txt.trim().length > 0);
                    return draftTexts.join('\n');
                });
                const dataStr = lines.join('\n');
                const dataUri = 'data:text/plain;charset=utf-8,'+ encodeURIComponent(dataStr);
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', `${title.replace(/\s+/g, '_')}_All_Drafts.txt`);
                linkElement.click();
                setShowExportMenu(false);
            };

            const exportApproved = () => {
                const lines = segments.map(seg => {
                    if (seg.isBlank) return "";
                    const completed = seg.translations.find(t => t.status === 'COMPLETE');
                    return completed && completed.text ? completed.text : "";
                });
                const dataStr = lines.join('\n');
                const dataUri = 'data:text/plain;charset=utf-8,'+ encodeURIComponent(dataStr);
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', `${title.replace(/\s+/g, '_')}_Approved.txt`);
                linkElement.click();
                setShowExportMenu(false);
            };

            const exportJSON = () => {
                const data = { title, rawText, segments };
                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(data));
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataStr);
                linkElement.setAttribute('download', `${title.replace(/\s+/g, '_')}_Project.json`);
                linkElement.click();
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.segments && data.rawText !== undefined) {
                            setTitle(data.title || "Untitled Work");
                            setRawText(data.rawText);
                            setSegments(data.segments);
                            setAppMode('translate');
                        } else {
                            setErrorMsg("Invalid project file format.");
                        }
                    } catch (err) {
                        setErrorMsg("Could not parse the JSON file.");
                    }
                    e.target.value = null; 
                };
                reader.readAsText(file);
            };

            if (appMode === 'setup') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-4 md:p-8 bg-gray-50 overflow-y-auto">
                        <div className="max-w-2xl w-full bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-100 my-auto">
                            <h1 className="text-2xl md:text-3xl font-bold mb-6 text-gray-800 flex items-center gap-3">
                                <span className="text-blue-500 font-serif italic text-4xl">L</span>
                                Lyrical Translator
                            </h1>
                            <p className="text-gray-600 mb-4 text-sm md:text-base">Paste your source poem or song lyrics below.</p>
                            <textarea 
                                className="w-full h-64 p-4 border rounded-lg mb-6 focus:ring-2 focus:ring-blue-400 focus:border-transparent resize-none font-serif text-lg"
                                value={rawText}
                                onChange={(e) => setRawText(e.target.value)}
                            ></textarea>
                            
                            <input type="file" accept=".json" ref={fileInputRef} onChange={handleImportJSON} className="hidden" />
                            
                            <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
                                <button 
                                    onClick={() => fileInputRef.current.click()}
                                    className="w-full sm:w-auto text-emerald-600 font-medium py-3 px-6 rounded-lg hover:bg-emerald-50 transition-colors border border-emerald-200"
                                >
                                    Import Project (.json)
                                </button>
                                <button 
                                    onClick={handleStart}
                                    disabled={!rawText.trim()}
                                    className="w-full sm:w-auto bg-blue-600 disabled:bg-gray-400 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-md"
                                >
                                    Start Translating
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                    <header className="bg-white border-b px-3 md:px-6 py-3 md:py-4 flex flex-col sm:flex-row flex-wrap justify-between items-center shrink-0 shadow-sm z-30 gap-3 md:gap-4">
                        <input 
                            type="text" 
                            value={title}
                            onChange={(e) => setTitle(e.target.value)}
                            className="text-lg md:text-xl font-bold bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 focus:outline-none transition-colors w-full sm:w-auto text-center sm:text-left"
                        />
                        
                        <div className="flex bg-gray-100 p-1 rounded-lg w-full sm:w-auto justify-center">
                            <button onClick={() => setAppMode('annotate')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${appMode === 'annotate' ? 'bg-white shadow text-indigo-600' : 'text-gray-600 hover:text-gray-900'}`}>Annotate</button>
                            <button onClick={() => setAppMode('translate')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${appMode === 'translate' ? 'bg-white shadow text-blue-600' : 'text-gray-600 hover:text-gray-900'}`}>Translate</button>
                        </div>

                        <div className="flex flex-wrap items-center justify-center gap-2 w-full sm:w-auto">
                            <button onClick={analyzeAll} className="px-3 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-md text-sm font-medium border border-indigo-200">Auto-Analyze</button>
                            <div className="hidden sm:block h-6 w-px bg-gray-300 mx-1"></div>
                            
                            <input type="file" accept=".json" ref={fileInputRef} onChange={handleImportJSON} className="hidden" />
                            <button onClick={() => fileInputRef.current.click()} className="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-md text-sm font-medium border border-emerald-200">Import</button>
                            
                            <div className="relative">
                                <button onClick={() => setShowExportMenu(!showExportMenu)} className="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-md text-sm font-medium border border-emerald-200">
                                    Export ▼
                                </button>
                                {showExportMenu && (
                                    <>
                                        <div className="fixed inset-0 z-40" onClick={() => setShowExportMenu(false)}></div>
                                        <div className="absolute right-0 mt-1 w-56 bg-white border border-gray-200 rounded-md shadow-lg z-50 py-1">
                                            <button onClick={() => { exportJSON(); setShowExportMenu(false); }} className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">Export as JSON Project</button>
                                            <button onClick={exportAllDrafts} className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">Export All Drafts (TXT)</button>
                                            <button onClick={exportApproved} className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">Export Approved Target (TXT)</button>
                                        </div>
                                    </>
                                )}
                            </div>

                            <div className="hidden sm:block h-6 w-px bg-gray-300 mx-1"></div>
                            <button onClick={() => setShowResetModal(true)} className="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-md text-sm font-medium border border-red-200">Reset</button>
                        </div>
                    </header>

                    {errorMsg && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center border border-gray-200">
                                <h2 className="text-xl font-bold mb-4 text-red-600">Import Error</h2>
                                <p className="text-gray-600 mb-6 text-sm">{errorMsg}</p>
                                <div className="flex justify-center">
                                    <button onClick={() => setErrorMsg(null)} className="px-4 py-2 bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 font-medium transition-colors">Dismiss</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showResetModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center border border-gray-200">
                                <h2 className="text-xl font-bold mb-4 text-gray-800">Reset Application?</h2>
                                <p className="text-gray-600 mb-6 text-sm">This will permanently clear all current translation data and return to the setup screen. Are you sure?</p>
                                <div className="flex justify-center gap-4">
                                    <button onClick={() => setShowResetModal(false)} className="px-4 py-2 bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 font-medium transition-colors">Cancel</button>
                                    <button onClick={() => { setRawText(""); setSegments([]); setAppMode('setup'); setShowResetModal(false); }} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-bold transition-colors">Yes, Reset</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTokenPopup && (
                        <ActionPopover 
                            popupData={activeTokenPopup}
                            segments={segments}
                            setSegments={setSegments}
                            compactRhymes={compactRhymes}
                            close={() => setActiveTokenPopup(null)}
                        />
                    )}

                    {}
                    <div className="flex-1 overflow-y-auto bg-gray-100 p-2 md:p-6 relative w-full touch-pan-y">
                        <div className="flex flex-col gap-4 md:gap-6 w-full max-w-full pb-32">
                            {segments.map((segment, index) => (
                                <SegmentRow 
                                    key={segment.id}
                                    segment={segment}
                                    index={index}
                                    segments={segments}
                                    setSegments={setSegments}
                                    appMode={appMode}
                                    setActiveTokenPopup={setActiveTokenPopup}
                                    focusedRhymeGroup={focusedRhymeGroup}
                                    setFocusedRhymeGroup={setFocusedRhymeGroup}
                                    tokenizeText={tokenizeText}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const SegmentRow = ({ segment, index, segments, setSegments, appMode, setActiveTokenPopup, focusedRhymeGroup, setFocusedRhymeGroup, tokenizeText }) => {
            if (segment.isBlank) return <div className="w-full h-6"></div>;

            const updateSegment = (newSegment) => {
                const newSegs = [...segments];
                newSegs[index] = newSegment;
                setSegments(newSegs);
            };

            const addTranslation = () => {
                updateSegment({ ...segment, translations: [...segment.translations, { id: generateId(), text: "", tokens: [], status: 'NEUTRAL' }] });
            };

            const updateTranslation = (transId, updates) => {
                let finalUpdates = { ...updates };
                if (updates.text !== undefined) {
                    const trans = segment.translations.find(t => t.id === transId);
                    finalUpdates.tokens = tokenizeText(updates.text, trans.tokens, 'target');
                }
                updateSegment({ ...segment, translations: segment.translations.map(t => t.id === transId ? { ...t, ...finalUpdates } : t) });
            };

            return (
                <div className="w-full relative group/row">
                    <div className={`flex flex-col md:grid md:grid-cols-12 gap-4 md:gap-6 bg-white p-3 md:p-4 rounded-xl shadow-sm border transition-colors ${appMode === 'annotate' ? 'border-indigo-300 ring-1 ring-indigo-100' : 'border-gray-200'} w-full`}>
                        <div className="md:col-span-4 border-b md:border-b-0 md:border-r pb-3 md:pb-0 md:pr-4 text-base md:text-lg font-serif leading-relaxed whitespace-pre-wrap break-words w-full">
                            {segment.tokens.map(token => (
                                <Token 
                                    key={token.id} token={token} segmentId={segment.id} type="source" appMode={appMode}
                                    setActiveTokenPopup={setActiveTokenPopup} focusedRhymeGroup={focusedRhymeGroup} setFocusedRhymeGroup={setFocusedRhymeGroup}
                                />
                            ))}
                        </div>
                        <div className="md:col-span-6 flex gap-4 overflow-x-auto hide-scrollbar snap-x pb-2 pt-2 md:pt-0 touch-pan-x w-full">
                            {segment.translations.map((trans, tIndex) => (
                                <TranslationCard 
                                    key={trans.id} segmentId={segment.id} trans={trans} index={tIndex} total={segment.translations.length}
                                    appMode={appMode} updateTranslation={updateTranslation} setActiveTokenPopup={setActiveTokenPopup}
                                    focusedRhymeGroup={focusedRhymeGroup} setFocusedRhymeGroup={setFocusedRhymeGroup}
                                />
                            ))}
                            {appMode === 'translate' && (
                                <div className="flex-shrink-0 flex items-center justify-center w-12 snap-center">
                                    <button onClick={addTranslation} className="w-10 h-10 rounded-full border-2 border-dashed border-gray-300 text-gray-400 hover:text-blue-500 hover:border-blue-500 transition-all">+</button>
                                </div>
                            )}
                        </div>
                        <div className="md:col-span-2 mt-2 md:mt-0 w-full">
                            <textarea
                                value={segment.notes}
                                onChange={(e) => updateSegment({...segment, notes: e.target.value})}
                                placeholder="Notes..."
                                className="w-full h-full min-h-[60px] md:min-h-[80px] p-2 text-sm bg-gray-50 border-gray-200 rounded resize-none focus:ring-1 focus:ring-blue-400 focus:bg-white transition-colors"
                            ></textarea>
                        </div>
                    </div>
                </div>
            );
        };

        const TranslationCard = ({ segmentId, trans, index, total, appMode, updateTranslation, setActiveTokenPopup, focusedRhymeGroup, setFocusedRhymeGroup }) => {
            const editorRef = useRef(null);
            const [caretPos, setCaretPos] = useState(null);
            const [revision, setRevision] = useState(0);
            const shouldRestoreFocusRef = useRef(false);

            const cycleStatus = () => {
                const statuses = ['NEUTRAL', 'INCOMPLETE', 'ALMOST', 'COMPLETE'];
                updateTranslation(trans.id, { status: statuses[(statuses.indexOf(trans.status) + 1) % statuses.length] });
            };

            const handleInput = (e) => {
                const caret = getCaretPosition(editorRef.current);
                setCaretPos(caret);
                shouldRestoreFocusRef.current = true;
                setRevision(r => r + 1);
                updateTranslation(trans.id, { text: e.currentTarget.innerText });
            };

            useLayoutEffect(() => {
                if (shouldRestoreFocusRef.current && caretPos !== null && editorRef.current) {
                    if (document.activeElement !== editorRef.current) {
                        editorRef.current.focus();
                    }
                    setCaretPosition(editorRef.current, caretPos);
                    shouldRestoreFocusRef.current = false;
                }
            }, [trans.tokens, caretPos, revision]);

            return (
                <div className={`flex-shrink-0 w-[85vw] md:w-64 snap-center flex flex-col border-2 rounded-lg relative transition-colors ${STATUS_COLORS[trans.status]} ${appMode === 'annotate' ? 'ring-2 ring-indigo-300 border-indigo-400' : ''}`}>
                    <div className="flex justify-between items-center px-2 py-1 border-b border-inherit bg-white/50 rounded-t-md">
                        <span className="text-xs font-semibold text-gray-700">Draft {index + 1}</span>
                        <button onClick={cycleStatus} className="text-[10px] w-5 h-5 rounded-full hover:bg-black/10">🚦</button>
                    </div>
                    <div 
                        key={`editor-${trans.id}-${revision}`}
                        ref={editorRef}
                        dir="rtl"
                        contentEditable={appMode === 'translate'}
                        suppressContentEditableWarning={true}
                        onInput={handleInput}
                        className={`flex-1 w-full p-3 min-h-[80px] font-sans text-right text-lg focus:outline-none whitespace-pre-wrap break-words ${appMode === 'translate' ? 'focus:ring-2 focus:ring-blue-400 bg-white/80 rounded cursor-text' : 'bg-white/40'}`}
                    >
                        {trans.tokens && trans.tokens.map(token => (
                            <Token key={token.id} token={token} segmentId={segmentId} transId={trans.id} type="target" appMode={appMode} setActiveTokenPopup={setActiveTokenPopup} focusedRhymeGroup={focusedRhymeGroup} setFocusedRhymeGroup={setFocusedRhymeGroup} />
                        ))}
                        {(!trans.tokens || trans.tokens.length === 0) && appMode !== 'translate' && <span className="text-gray-400 text-sm">No text.</span>}
                    </div>
                </div>
            );
        };

        const Token = ({ token, segmentId, transId, type, appMode, setActiveTokenPopup, focusedRhymeGroup, setFocusedRhymeGroup }) => {
            if (token.isSpace) {
                return <span>{token.text}</span>;
            }
            if (token.isPunctuation) {
                return <span className="text-gray-800">{token.text}</span>;
            }

            const isClickableMode = appMode === 'annotate';
            
            const handleClick = (e) => {
                e.stopPropagation();
                if (isClickableMode) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    setActiveTokenPopup({
                        tokenId: token.id, segmentId, transId, type,
                        x: rect.left + rect.width / 2, y: rect.bottom
                    });
                }
            };

            return (
                <span 
                    className={`relative inline ${token.comment ? 'has-comment' : ''} ${isClickableMode ? 'cursor-pointer hover:opacity-75' : ''}`}
                    title={token.comment ? `Note: ${token.comment}` : ''}
                    onClick={handleClick}
                >
                    {token.prefix && <span className="text-gray-800">{token.prefix}</span>}
                    {token.syllables.map((syl, i) => {
                        const isDimmed = focusedRhymeGroup !== null && syl.rhymeGroup !== focusedRhymeGroup;
                        const isClickable = appMode === 'translate' && type === 'source' && syl.rhymeGroup;
                        
                        return (
                            <span 
                                key={i}
                                onClick={(e) => {
                                    if (isClickable) {
                                        e.stopPropagation();
                                        setFocusedRhymeGroup(prev => prev === syl.rhymeGroup ? null : syl.rhymeGroup);
                                    }
                                }}
                                className={`${syl.stress ? 'font-bold' : 'font-normal'} ${isClickable ? 'cursor-pointer' : ''}`}
                                style={{ 
                                    backgroundColor: getRhymeColor(syl.rhymeGroup),
                                    opacity: isDimmed ? 0.3 : 1,
                                    borderRadius: '0.125rem'
                                }}
                            >
                                {syl.text}
                            </span>
                        );
                    })}
                    {token.suffix && <span className="text-gray-800">{token.suffix}</span>}
                </span>
            );
        };

        const ActionPopover = ({ popupData, segments, setSegments, compactRhymes, close }) => {
            const popoverRef = useRef(null);
            const [position, setPosition] = useState({ left: popupData.x, top: popupData.y, opacity: 0, isAbove: false, maxHeight: null });

            useEffect(() => {
                if (popoverRef.current) {
                    const rect = popoverRef.current.getBoundingClientRect();
                    let newLeft = Math.max(rect.width / 2 + 10, Math.min(popupData.x, window.innerWidth - rect.width / 2 - 10));
                    let newTop = popupData.y + 10;
                    let isAbove = false;
                    
                    const spaceBelow = window.innerHeight - newTop - 10;
                    const spaceAbove = popupData.y - 20;
                    
                    let maxHeight = spaceBelow;

                    if (rect.height > spaceBelow && spaceAbove > spaceBelow) {
                        newTop = Math.max(10, popupData.y - rect.height - 10);
                        maxHeight = spaceAbove;
                        isAbove = true;
                    }

                    setPosition({ 
                        left: newLeft, 
                        top: newTop, 
                        maxHeight: Math.max(200, maxHeight),
                        opacity: 1, 
                        isAbove 
                    });
                }
            }, [popupData]);

            useEffect(() => {
                const handleOutsideClick = (e) => {
                    if (popoverRef.current && !popoverRef.current.contains(e.target)) {
                        close();
                    }
                };
                document.addEventListener('click', handleOutsideClick);
                return () => document.removeEventListener('click', handleOutsideClick);
            }, [close]);

            const segment = segments.find(s => s.id === popupData.segmentId);
            const tokenList = popupData.type === 'source' ? segment?.tokens : segment?.translations.find(t => t.id === popupData.transId)?.tokens;
            const token = tokenList?.find(t => t.id === popupData.tokenId);

            if (!token) {
                close();
                return null;
            }

            const segmentIndex = segments.findIndex(s => s.id === popupData.segmentId);
            const tokenIndex = tokenList.findIndex(t => t.id === popupData.tokenId);

            const handleMerge = (idx1, idx2) => {
                const seg1 = segments[idx1];
                const seg2 = segments[idx2];
                if (!seg1 || !seg2) return;

                const breakToken = { id: generateId(), text: '\n', isSpace: true, isLineBreak: true, syllables: [{text: '\n', stress: false}] };
                const mergedSourceTokens = [...seg1.tokens, breakToken, ...seg2.tokens];

                const maxTrans = Math.max(seg1.translations.length, seg2.translations.length);
                const mergedTranslations = [];
                for(let i=0; i<maxTrans; i++) {
                    const t1 = seg1.translations[i] || { tokens: [], text: '', status: 'NEUTRAL' };
                    const t2 = seg2.translations[i] || { tokens: [], text: '', status: 'NEUTRAL' };
                    const mergedText = t1.text + (t1.text && t2.text ? '\n' : '') + t2.text;
                    
                    mergedTranslations.push({
                        id: generateId(),
                        status: t1.status === 'COMPLETE' && t2.status === 'COMPLETE' ? 'COMPLETE' : 'NEUTRAL',
                        text: mergedText,
                        tokens: [...(t1.tokens||[]), { ...breakToken, id: generateId() }, ...(t2.tokens||[])]
                    });
                }

                const newSegments = [...segments];
                newSegments.splice(idx1, 2, {
                    ...seg1,
                    tokens: mergedSourceTokens,
                    translations: mergedTranslations,
                    notes: seg1.notes + (seg1.notes && seg2.notes ? '\n' : '') + seg2.notes
                });
                setSegments(compactRhymes(newSegments));
                close();
            };

            const handleSplit = () => {
                const seg = segments[segmentIndex];
                const seg1Tokens = seg.tokens.slice(0, tokenIndex);
                const seg2Tokens = seg.tokens.slice(tokenIndex);

                const newSeg1 = { ...seg, id: generateId(), tokens: seg1Tokens };
                const newSeg2 = { 
                    id: generateId(), 
                    isBlank: false,
                    tokens: seg2Tokens, 
                    translations: [{id: generateId(), text: "", tokens: [], status: 'NEUTRAL'}],
                    notes: ""
                };

                const newSegments = [...segments];
                newSegments.splice(segmentIndex, 1, newSeg1, newSeg2);
                setSegments(compactRhymes(newSegments));
                close();
            };

            const updateToken = (updates) => {
                let newSegments;
                if (popupData.type === 'source') {
                    newSegments = segments.map(s => s.id === segment.id ? { ...s, tokens: s.tokens.map(t => t.id === token.id ? { ...t, ...updates } : t) } : s);
                    newSegments = compactRhymes(newSegments);
                } else {
                    newSegments = segments.map(s => s.id === segment.id ? { ...s, translations: s.translations.map(t => t.id === popupData.transId ? { ...t, tokens: t.tokens.map(tk => tk.id === token.id ? { ...tk, ...updates } : tk) } : t) } : s);
                }
                setSegments(newSegments);
            };

            const updateSyllableText = (hyphenatedString) => {
                const chunks = hyphenatedString.split('-').map(s => s.trim()).filter(s => s.length > 0);
                if (chunks.length === 0) return;
                updateToken({ syllables: chunks.map((chunk, i) => ({
                    text: chunk, stress: token.syllables[i]?.stress || false, 
                    rhymeKey: token.syllables[i]?.rhymeKey || null, rhymeGroup: token.syllables[i]?.rhymeGroup || null
                }))});
            };

            let maxRhymeGroup = 0;
            segments.forEach(s => {
                if(s.isBlank) return;
                s.tokens.forEach(t => t.syllables?.forEach(syl => { if (syl.rhymeGroup > maxRhymeGroup) maxRhymeGroup = syl.rhymeGroup; }));
                s.translations.forEach(tr => tr.tokens?.forEach(t => t.syllables?.forEach(syl => { if (syl.rhymeGroup > maxRhymeGroup) maxRhymeGroup = syl.rhymeGroup; })));
            });

            return (
                <div 
                    ref={popoverRef}
                    className="fixed bg-white text-gray-800 p-4 rounded-xl shadow-2xl border border-gray-200 z-50 w-[90vw] max-w-[288px] transform -translate-x-1/2 transition-opacity duration-200 overflow-y-auto"
                    style={{ 
                        left: position.left, 
                        top: position.top, 
                        maxHeight: position.maxHeight ? `${position.maxHeight}px` : '80vh', 
                        opacity: position.opacity 
                    }}
                >
                <div className="font-bold border-b pb-2 mb-3 text-lg flex justify-between items-center">
                    <span>{token.text}</span>
                    <button onClick={close} className="text-xs font-normal text-gray-600 bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded transition-colors cursor-pointer">✕ Close</button>
                </div>
                
                <div className="mb-4 bg-blue-50 p-2 rounded border border-blue-100">
                    <label className="text-[10px] font-bold text-blue-800 uppercase block mb-1">Edit Syllable Splits</label>
                        <input 
                            key={`syl-input-${token.id}-${token.text}`}
                            type="text" 
                            dir={popupData.type === 'target' ? 'rtl' : 'ltr'}
                            defaultValue={token.syllables.map(s => s.text).join('-')}
                            onBlur={(e) => updateSyllableText(e.target.value)}
                            onKeyDown={(e) => { if(e.key === 'Enter') updateSyllableText(e.target.value) }}
                            className="w-full border border-blue-200 rounded px-2 py-1 text-sm focus:ring-1 focus:ring-blue-500 outline-none"
                        />
                    </div>

                    <div className="mb-4">
                        <label className="text-xs font-semibold text-gray-500 uppercase block mb-2">Meter & Rhyme Color</label>
                        <div className="flex flex-col gap-3">
                            {token.syllables.map((syl, i) => (
                                <div key={i} className="flex flex-col gap-2 bg-gray-50 p-2 rounded border border-gray-200">
                                    <button 
                                        onClick={() => {
                                            let ns = [...token.syllables]; ns[i].stress = !ns[i].stress; updateToken({ syllables: ns });
                                        }}
                                        className={`w-full px-2 py-1.5 rounded text-sm transition-colors text-center ${syl.stress ? 'bg-gray-800 text-white font-bold shadow-inner' : 'bg-white hover:bg-gray-100 border border-gray-300 text-gray-700'}`}
                                        dir={popupData.type === 'target' ? 'rtl' : 'ltr'}
                                    >
                                        {syl.text} {syl.stress ? '(!)' : ''}
                                    </button>
                                    
                                    <div className="flex flex-wrap gap-1.5 justify-center items-center p-1 bg-white border border-gray-200 rounded">
                                        <button 
                                            onClick={() => { let ns = [...token.syllables]; ns[i].rhymeGroup = null; updateToken({ syllables: ns }); }}
                                            className="px-2 py-1 text-[10px] font-bold rounded bg-gray-100 hover:bg-gray-200 text-gray-500"
                                        >
                                            ✕ Clear
                                        </button>
                                        {Array.from({length: maxRhymeGroup}, (_, idx) => idx + 1).map(id => (
                                            <button 
                                                key={id}
                                                onClick={() => { let ns = [...token.syllables]; ns[i].rhymeGroup = id; updateToken({ syllables: ns }); }}
                                                className={`w-5 h-5 rounded-full border-2 transition-all ${syl.rhymeGroup === id ? 'border-gray-800 scale-125 shadow-sm' : 'border-transparent hover:scale-110'}`}
                                                style={{ backgroundColor: getRhymeColor(id) }}
                                            ></button>
                                        ))}
                                        <button 
                                            onClick={() => { let ns = [...token.syllables]; ns[i].rhymeGroup = maxRhymeGroup + 1; updateToken({ syllables: ns }); }}
                                            className="px-2 py-1 text-[10px] font-bold rounded bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100"
                                        >
                                            + New
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <label className="text-xs font-semibold text-gray-500 uppercase block mb-1">Word Note</label>
                        <input 
                            type="text" 
                            value={token.comment || ''}
                            onChange={(e) => updateToken({ comment: e.target.value })}
                            className="w-full border rounded px-2 py-1 text-sm outline-none"
                            placeholder="Add a thought..."
                        />
                    </div>

                    <div className="mt-4 pt-4 border-t border-gray-200 flex flex-col gap-2">
                        {popupData.type === 'source' && tokenIndex > 0 && (
                            <button onClick={handleSplit} className="px-2 py-1.5 text-xs font-bold rounded bg-gray-100 hover:bg-gray-200 text-gray-700">
                                ⤤ Split Segment Here
                            </button>
                        )}
                        {segmentIndex > 0 && tokenIndex === 0 && (
                            <button onClick={() => handleMerge(segmentIndex - 1, segmentIndex)} className="px-2 py-1.5 text-xs font-bold rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700">
                                ↑ Merge with Previous Segment
                            </button>
                        )}
                        {segmentIndex < segments.length - 1 && tokenIndex === tokenList.length - 1 && (
                            <button onClick={() => handleMerge(segmentIndex, segmentIndex + 1)} className="px-2 py-1.5 text-xs font-bold rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700">
                                ↓ Merge with Next Segment
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body></html>
